spring.application.name=student-preparation-tracker

# ================= DATABASE =================
spring.datasource.url=jdbc:postgresql://localhost:5432/student_preparation_tracker
spring.datasource.username=postgres
spring.datasource.password=${POST_PASSWORD}

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================= SERVER =================
server.port=8080

# ================= RESEND EMAIL =================
resend.api.key=${STUDENTPREPARATION_API_KEY}